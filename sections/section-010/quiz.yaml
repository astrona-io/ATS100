# Knowledge check for section 010. Listed in astrona.yaml as a `type: quiz` entry after the capstone lab.
schema_version: 1
kind: question_bank
id: ats100-010
course_id: ATS100
exam_code: HARBOR
status: draft
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: section
  id: section-010
  title: "Harbor Architecture And OCI Artifacts"
placement:
  position: after
  reading: sections/section-010/module-01/course-03-oci-artifacts.md
questions:
  - id: ats100-010-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the component that runs the token service"
    source_readings:
      - sections/section-010/module-01/course-01-the-harbor-components.md
    prompt: "Which Harbor component signs the tokens that the registry accepts?"
    options:
      - id: a
        text: "`registry`."
        explanation: "Not correct. The registry only checks the token. It does not sign it."
      - id: b
        text: "`core`."
        explanation: "Correct. `core` checks the user and the project, then signs the token."
      - id: c
        text: "`nginx`."
        explanation: "Not correct. `nginx` ends TLS and forwards requests. It does not sign tokens."
      - id: d
        text: "`jobservice`."
        explanation: "Not correct. `jobservice` runs background jobs. It does not handle sign-in."
    correct_option: b
    explanation: "Correct. `core` checks the user and the project, then signs the token."

  - id: ats100-010-q02
    type: single_choice
    difficulty: beginner
    learning_objective: "Describe what the registry component stores"
    source_readings:
      - sections/section-010/module-01/course-01-the-harbor-components.md
    prompt: "Which component stores the layers and manifests of every artifact and answers under `/v2/`?"
    options:
      - id: a
        text: "`portal`."
        explanation: "Not correct. `portal` is the web user interface. It stores no artifacts."
      - id: b
        text: "`database`."
        explanation: "Not correct. The PostgreSQL database holds projects, users, policies and scan results, not layers."
      - id: c
        text: "`redis`."
        explanation: "Not correct. Redis holds the job queue and caches, not layers."
      - id: d
        text: "`registry`."
        explanation: "Correct. It is the CNCF Distribution registry and serves the OCI distribution API."
    correct_option: d
    explanation: "Correct. It is the CNCF Distribution registry and serves the OCI distribution API."

  - id: ats100-010-q03
    type: single_choice
    difficulty: beginner
    learning_objective: "Name the component that runs background jobs"
    source_readings:
      - sections/section-010/module-01/course-01-the-harbor-components.md
    prompt: "Scans, replication, garbage collection and tag retention run in which component?"
    options:
      - id: a
        text: "`jobservice`."
        explanation: "Correct. It runs the background jobs, with its queue in `redis`."
      - id: b
        text: "`core`."
        explanation: "Not correct. `core` is the API server. It hands the work to `jobservice`."
      - id: c
        text: "`trivy`."
        explanation: "Not correct. `trivy` only scans when `jobservice` asks it to. It does not schedule jobs."
      - id: d
        text: "`registry`."
        explanation: "Not correct. The registry stores content. It runs no jobs."
    correct_option: a
    explanation: "Correct. It runs the background jobs, with its queue in `redis`."

  - id: ats100-010-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Place a failure in the right component"
    source_readings:
      - sections/section-010/module-01/course-01-the-harbor-components.md
    prompt: "A push fails because the password is wrong. Which component rejects the request?"
    options:
      - id: a
        text: "`registry`."
        explanation: "Not correct. The registry knows nothing about users. A full disk fails there."
      - id: b
        text: "`database`."
        explanation: "Not correct. The database stores data. It does not answer the sign-in request."
      - id: c
        text: "`core`."
        explanation: "Correct. `core` checks who you are, so a wrong password fails there."
      - id: d
        text: "`portal`."
        explanation: "Not correct. The portal is the web interface and is not in the push path."
    correct_option: c
    explanation: "Correct. `core` checks who you are, so a wrong password fails there."

  - id: ats100-010-q05
    type: single_choice
    difficulty: beginner
    learning_objective: "Choose the Service a client should use"
    source_readings:
      - sections/section-010/module-01/course-01-the-harbor-components.md
    prompt: "Which Kubernetes Service in the namespace `harbor` should clients use to reach Harbor?"
    options:
      - id: a
        text: "`harbor-core`, which points at `core`."
        explanation: "Not correct. Calling a component Service directly skips TLS and authentication."
      - id: b
        text: "`harbor-registry`, which points at `registry`."
        explanation: "Not correct. Calling it directly skips the token handshake and behaves differently."
      - id: c
        text: "`harbor-portal`, which points at `portal`."
        explanation: "Not correct. It serves only the web interface, not the API or image traffic."
      - id: d
        text: "`harbor`, which points at `nginx`."
        explanation: "Correct. It is the only Service meant for clients."
    correct_option: d
    explanation: "Correct. It is the only Service meant for clients."

  - id: ats100-010-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Follow the token handshake of a push"
    source_readings:
      - sections/section-010/module-01/course-02-following-a-push.md
    prompt: "In a push, how does the registry answer the first request that has no token?"
    options:
      - id: a
        text: "With `401 Unauthorized` and a `WWW-Authenticate` header that names the token realm."
        explanation: "Correct. The client then asks the token service in `core` for a token."
      - id: b
        text: "With `403 Forbidden` and the name of the project."
        explanation: "Not correct. The first answer is 401 with the token realm, not 403."
      - id: c
        text: "With `201 Created`, and it asks for the token afterwards."
        explanation: "Not correct. The registry accepts only requests that carry a valid token."
      - id: d
        text: "With a redirect to the web portal sign-in page."
        explanation: "Not correct. The registry redirects to no page. It names the token realm."
    correct_option: a
    explanation: "Correct. The client then asks the token service in `core` for a token."

  - id: ats100-010-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use the health API to find a broken component"
    source_readings:
      - sections/section-010/module-01/course-02-following-a-push.md
    prompt: "The web portal loads, but pushes fail. What is the quickest first look at the cause?"
    options:
      - id: a
        text: "Reinstall the Helm release `harbor`."
        explanation: "Not correct. Reinstalling loses every artifact in the lab and fixes nothing you have not found."
      - id: b
        text: "Read only the overall `status` field."
        explanation: "Not correct. It says something is wrong, not what."
      - id: c
        text: "Read the `components` list at `/api/v2.0/health`."
        explanation: "Correct. `core` checks every component and reports which one is unhealthy."
      - id: d
        text: "Open the portal and check that it loads."
        explanation: "Not correct. The portal can load while `registry` or `jobservice` is down."
    correct_option: c
    explanation: "Correct. `core` checks every component and reports which one is unhealthy."

  - id: ats100-010-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Predict the effect of a stopped registry"
    source_readings:
      - sections/section-010/module-01/course-02-following-a-push.md
    prompt: "You scale the `harbor-registry` Deployment to 0 replicas. What do you see?"
    options:
      - id: a
        text: "Every component is `unhealthy` and the portal does not load."
        explanation: "Not correct. Other components keep running. Only the registry and `registryctl` report unhealthy."
      - id: b
        text: "`registry` and `registryctl` are `unhealthy` and pushes fail, while the API and the portal keep working."
        explanation: "Correct. Only the registry pod is gone."
      - id: c
        text: "Pushes still work, because `core` keeps a copy of the layers."
        explanation: "Not correct. `core` stores no layers, so a push fails."
      - id: d
        text: "Only `jobservice` becomes `unhealthy`."
        explanation: "Not correct. The registry pod runs `registry` and `registryctl`, and those two are reported."
    correct_option: b
    explanation: "Correct. Only the registry pod is gone."

  - id: ats100-010-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Explain why a digest proves a copy"
    source_readings:
      - sections/section-010/module-01/course-03-oci-artifacts.md
    prompt: "Which check proves that a copy in Harbor is the same artifact as its source?"
    options:
      - id: a
        text: "Compare the `sha256` digest of the source and the copy."
        explanation: "Correct. A digest is the hash of the manifest and changes if any byte changes."
      - id: b
        text: "Compare the tags of the source and the copy."
        explanation: "Not correct. A tag can be pointed at other content at any time."
      - id: c
        text: "Compare the push time shown in the portal."
        explanation: "Not correct. The time says nothing about the content."
      - id: d
        text: "Check that the copy is in a project with the same name."
        explanation: "Not correct. A project name says nothing about the content."
    correct_option: a
    explanation: "Correct. A digest is the hash of the manifest and changes if any byte changes."

  - id: ats100-010-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Write the API path for a nested repository"
    source_readings:
      - sections/section-010/module-01/course-03-oci-artifacts.md
    prompt: "In the Harbor API path, how do you write the repository `charts/podinfo`?"
    options:
      - id: a
        text: "`charts/podinfo`, written as it is."
        explanation: "Not correct. The extra slash makes the path point at a different resource."
      - id: b
        text: "`charts%2Fpodinfo`, encoded once."
        explanation: "Not correct. A single encoding returns `404`."
      - id: c
        text: "`charts.podinfo`, with a dot."
        explanation: "Not correct. Harbor does not accept a dot in place of the slash."
      - id: d
        text: "`charts%252Fpodinfo`, encoded twice."
        explanation: "Correct. Harbor needs the slash encoded twice in the path."
    correct_option: d
    explanation: "Correct. Harbor needs the slash encoded twice in the path."
