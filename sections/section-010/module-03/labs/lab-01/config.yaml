# Restore Harbor After Its Database Stopped
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-100-lab-010-03"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"
bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, Harbor 2.15.4 (chart 1.19.4) and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-100-lab-010-03-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"
testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until Harbor answers from the workstation"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"
validation:
  scripts:
    - name: "validate-database-running"
      description: "Confirms the database StatefulSet is ready"
      type: "file"
      source: "validation/validate-database-running.sh"
    - name: "validate-all-components-healthy"
      description: "Confirms every component reports healthy"
      type: "file"
      source: "validation/validate-all-components-healthy.sh"
    - name: "validate-data-survived"
      description: "Confirms the pushed image survived with its digest"
      type: "file"
      source: "validation/validate-data-survived.sh"
    - name: "validate-no-reinstall"
      description: "Confirms the Helm release was not upgraded or reinstalled"
      type: "file"
      source: "validation/validate-no-reinstall.sh"
teardown:
  keepCluster: false
runtime:
  kind:
    preloadImages:
      - alpine:3.22
      - docker.io/goharbor/harbor-core:v2.15.4
      - docker.io/goharbor/harbor-db:v2.15.4
      - docker.io/goharbor/harbor-jobservice:v2.15.4
      - docker.io/goharbor/harbor-portal:v2.15.4
      - docker.io/goharbor/harbor-registryctl:v2.15.4
      - docker.io/goharbor/nginx-photon:v2.15.4
      - docker.io/goharbor/registry-photon:v2.15.4
      - docker.io/goharbor/trivy-adapter-photon:v2.15.4
      - docker.io/valkey/valkey:8.1.10-alpine
