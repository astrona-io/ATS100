schema_version: 1
kind: question_bank
id: ats100-030-m03
course_id: ATS100
exam_code: HARBOR
status: alpha
provenance: Original practice material written for this course; not official exam questions.
scope:
  type: module
  id: section-030-module-03
  title: "Script The Harbor CLI"
placement:
  position: after
  reading: sections/section-030/module-03/course-05-summary.md
questions:
  - id: ats100-030-m03-q01
    type: single_choice
    difficulty: beginner
    learning_objective: "Avoid prompts"
    source_readings:
      - sections/section-030/module-03/course-01-commands-that-never-ask.md
    prompt: "Why can `harbor artifact list` with no argument hang a script?"
    options:
      - id: a
        text: "It asks for the project and repository interactively."
        explanation: "Correct. A script cannot answer."
      - id: b
        text: "It deletes artifacts."
        explanation: "Not correct. It only lists."
      - id: c
        text: "It needs `sudo`."
        explanation: "Not correct. No privilege is involved."
      - id: d
        text: "It always returns an empty list."
        explanation: "Not correct. It waits for input."
    correct_option: a
    explanation: "Correct. A script cannot answer."

  - id: ats100-030-m03-q02
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose the output"
    source_readings:
      - sections/section-030/module-03/course-01-commands-that-never-ask.md
    prompt: "Which flag gives output that a script can parse?"
    options:
      - id: a
        text: "`-v`"
        explanation: "Not correct. That prints more detail."
      - id: b
        text: "`-o json`"
        explanation: "Correct. It prints JSON for `jq`."
      - id: c
        text: "`-c`"
        explanation: "Not correct. That selects a config file."
      - id: d
        text: "`-l`"
        explanation: "Not correct. That sets the log format."
    correct_option: b
    explanation: "Correct. It prints JSON for `jq`."

  - id: ats100-030-m03-q03
    type: single_choice
    difficulty: intermediate
    learning_objective: "Read list output"
    source_readings:
      - sections/section-030/module-03/course-01-commands-that-never-ask.md
    prompt: "Where are the items in the JSON of a list command?"
    options:
      - id: a
        text: "At the top level."
        explanation: "Not correct. The top level is an object."
      - id: b
        text: "In `items`."
        explanation: "Not correct. The field is `Payload`."
      - id: c
        text: "In the `Payload` array."
        explanation: "Correct. `jq` starts with `.Payload[]`."
      - id: d
        text: "In `rows`."
        explanation: "Not correct. The field is `Payload`."
    correct_option: c
    explanation: "Correct. `jq` starts with `.Payload[]`."

  - id: ats100-030-m03-q04
    type: single_choice
    difficulty: intermediate
    learning_objective: "Use exit codes"
    source_readings:
      - sections/section-030/module-03/course-01-commands-that-never-ask.md
    prompt: "How does a script know a `harbor` command failed?"
    options:
      - id: a
        text: "The output contains the word error."
        explanation: "Not correct. Messages change."
      - id: b
        text: "The output is empty."
        explanation: "Not correct. Some successes print nothing."
      - id: c
        text: "The command takes long."
        explanation: "Not correct. Time says nothing."
      - id: d
        text: "The exit code is not 0."
        explanation: "Correct. That is the reliable signal."
    correct_option: d
    explanation: "Correct. That is the reliable signal."

  - id: ats100-030-m03-q05
    type: single_choice
    difficulty: intermediate
    learning_objective: "Handle untagged artifacts"
    source_readings:
      - sections/section-030/module-03/course-02-loops-jq-bulk-changes.md
    prompt: "Why use `.tags[]?` instead of `.tags[]` in `jq`?"
    options:
      - id: a
        text: "To skip artifacts that have no tags without an error."
        explanation: "Correct. A missing list would stop the loop."
      - id: b
        text: "To sort tags."
        explanation: "Not correct. `?` does not sort."
      - id: c
        text: "To read only the first tag."
        explanation: "Not correct. It reads all tags."
      - id: d
        text: "To hide the digest."
        explanation: "Not correct. The digest is another field."
    correct_option: a
    explanation: "Correct. A missing list would stop the loop."

  - id: ats100-030-m03-q06
    type: single_choice
    difficulty: intermediate
    learning_objective: "Preview a bulk change"
    source_readings:
      - sections/section-030/module-03/course-02-loops-jq-bulk-changes.md
    prompt: "What is the safe way to run a bulk delete loop the first time?"
    options:
      - id: a
        text: "Run it with `-v`."
        explanation: "Not correct. It still deletes."
      - id: b
        text: "Put `echo` before the delete command, read the printed commands, then remove `echo`."
        explanation: "Correct. You see what would change."
      - id: c
        text: "Run it as `admin` only."
        explanation: "Not correct. The role does not preview."
      - id: d
        text: "Run it twice."
        explanation: "Not correct. The first run already deletes."
    correct_option: b
    explanation: "Correct. You see what would change."

  - id: ats100-030-m03-q07
    type: single_choice
    difficulty: intermediate
    learning_objective: "Remove a tag only"
    source_readings:
      - sections/section-030/module-03/course-02-loops-jq-bulk-changes.md
    prompt: "Which command removes only the tag `old-1`?"
    options:
      - id: a
        text: "`harbor artifact delete archive/podinfo:old-1`"
        explanation: "Not correct. It removes the artifact and all its tags."
      - id: b
        text: "`harbor repo delete archive/podinfo`"
        explanation: "Not correct. It removes the repository."
      - id: c
        text: "`harbor artifact tags delete archive/podinfo/old-1 old-1`"
        explanation: "Correct. It removes the tag and keeps the artifact."
      - id: d
        text: "`harbor project delete archive`"
        explanation: "Not correct. It removes the project."
    correct_option: c
    explanation: "Correct. It removes the tag and keeps the artifact."

  - id: ats100-030-m03-q08
    type: single_choice
    difficulty: intermediate
    learning_objective: "Choose a pipeline account"
    source_readings:
      - sections/section-030/module-03/course-03-signing-in-from-a-pipeline.md
    prompt: "Which account should a pipeline use?"
    options:
      - id: a
        text: "`admin`."
        explanation: "Not correct. A leak opens everything."
      - id: b
        text: "A personal account of a developer."
        explanation: "Not correct. It ties the job to a person."
      - id: c
        text: "A shared account without a password."
        explanation: "Not correct. Accounts need credentials."
      - id: d
        text: "A robot account with least permissions and an expiry."
        explanation: "Correct. A leak opens little."
    correct_option: d
    explanation: "Correct. A leak opens little."

  - id: ats100-030-m03-q09
    type: single_choice
    difficulty: intermediate
    learning_objective: "Hide the password"
    source_readings:
      - sections/section-030/module-03/course-03-signing-in-from-a-pipeline.md
    prompt: "How do you pass the password to `harbor login` without it appearing in the command line?"
    options:
      - id: a
        text: "With `--password-stdin` and a pipe from the secret."
        explanation: "Correct. Standard input is not in the process list."
      - id: b
        text: "With `--password` in plain text."
        explanation: "Not correct. It shows in history."
      - id: c
        text: "In the context name."
        explanation: "Not correct. The name is not a secret."
      - id: d
        text: "In the URL."
        explanation: "Not correct. URLs are logged."
    correct_option: a
    explanation: "Correct. Standard input is not in the process list."

  - id: ats100-030-m03-q10
    type: single_choice
    difficulty: advanced
    learning_objective: "Control the version"
    source_readings:
      - sections/section-030/module-03/course-04-installing-pinning-troubleshooting.md
    prompt: "Why pin the CLI version in a pipeline?"
    options:
      - id: a
        text: "Pinned versions run faster."
        explanation: "Not correct. Speed is the same."
      - id: b
        text: "Flags change between versions, and a new release can break the script."
        explanation: "Correct. The tool is young."
      - id: c
        text: "Unpinned versions cannot sign in."
        explanation: "Not correct. They can."
      - id: d
        text: "Pinning enables JSON output."
        explanation: "Not correct. `-o` is always available."
    correct_option: b
    explanation: "Correct. The tool is young."
