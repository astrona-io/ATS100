# Serve Harbor With Your Own Certificate
# Astrona graded lab. Schema: internal/config.LabConfig.

metadata:
  name: "ats-100-capstone-020"
  docs:
    guide: "solution.md"
    solution: "solution.md"
    question: "question.md"
    examQuestion: "question.md"
    prerequisites: "prerequisites.md"

bootstrap:
  init:
    - name: "install-harbor"
      description: "Installs Helm 3.22.1, Harbor 2.15.4 (chart 1.19.4) and the workstation pod"
      type: "file"
      source: "bootstrap/01-install-harbor.sh"
    - name: "ats-100-capstone-020-setup"
      description: "Creates the starting state the task works from"
      type: "file"
      source: "bootstrap/02-seed-state.sh"

testing:
  init:
    - name: "wait-for-harbor"
      description: "Waits until Harbor answers from the workstation"
      type: "file"
      source: "testing/wait-for-harbor.sh"
    - name: "reference-solution"
      description: "The remediation a correct learner performs; used by `astrona test`"
      type: "file"
      source: "solution/apply.sh"

validation:
  scripts:
    - name: "validate-values-use-secret"
      description: "Confirms the release serves the certificate from the Secret harbor-tls with TLS on"
      type: "file"
      source: "validation/validate-values-use-secret.sh"
    - name: "validate-certificate-verifies"
      description: "Confirms the served certificate verifies for harbor.localtest.me against the lab CA"
      type: "file"
      source: "validation/validate-certificate-verifies.sh"
    - name: "validate-ca-download"
      description: "Confirms Harbor offers the lab CA for download at /api/v2.0/systeminfo/getcert"
      type: "file"
      source: "validation/validate-ca-download.sh"
    - name: "validate-workstation-trusts"
      description: "Confirms the workstation trusts Harbor without extra options and can push"
      type: "file"
      source: "validation/validate-workstation-trusts.sh"

teardown:
  keepCluster: false
