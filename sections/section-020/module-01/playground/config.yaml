# Install And Configure Harbor With harbor-helm (PLAYGROUND) — Playground environment
# A clean sandbox: it spins up, runs the preparation script, then stays
# running for free exploration. No task, no grading, no `astrona submit`.
# Schema: internal/config.LabConfig.

metadata:
  name: "ats-100-playground-020-01"
  docs:
    guide: "docs/overview.md"

bootstrap:
  init:
    - name: "prepare"
      description: "Install Helm and Harbor, add the CoreDNS rewrite, start the workstation pod, and create the inventory project."
      type: "file"
      source: "bootstrap/prepare.sh"
  manifests:
    - name: "lab-start"
      description: "The workstation pod with the client tools (namespace workstation)."
      type: "file"
      source: "manifests/lab-start.yaml"

teardown:
  keepCluster: false
